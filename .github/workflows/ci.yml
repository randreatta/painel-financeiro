name: CI
on:
  push:
    branches: [migracao-cloudflare]
  pull_request:
  workflow_dispatch:
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambiente
        run: node -v && npm -v && npm view react version && npm view vite version
